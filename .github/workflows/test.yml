name: tests

on:
  push:
  pull_request:

jobs:
  js:
    name: JS smoke + i18n lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Runtime smoke test
        run: node tests/smoke.mjs
      - name: i18n integrity (parity + duplicates + code keys)
        run: node tests/i18n_check.mjs
      - name: Memory-reality unit tests
        run: node tests/memory_reality.test.mjs
      - name: Confidence unit tests
        run: node tests/confidence.test.mjs
      - name: Prediction-vs-reality unit tests
        run: node tests/prediction_reality.test.mjs
      - name: Adapter-reality unit tests
        run: node tests/adapter_reality.test.mjs
      - name: Fit-check unit tests
        run: node tests/fit_check.test.mjs
      - name: Research catalog and evidence boundaries
        run: node tests/research_studies.test.mjs
      - name: Attention entropy diagnostics
        run: node tests/entropy_scanner.test.mjs
      - name: Guide routes and metric provenance
        run: node tests/guide_bridge.test.mjs

  python:
    name: formula tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install numpy pytest
      - name: Pytest
        run: python -m pytest tests/test_taf_formulas.py tests/test_measurement_protocol.py tests/test_attention_entropy.py -q

  cpu-attention:
    name: Real attention on tiny CPU models (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==5.13.0 numpy pytest
      - run: python -m pytest tests/test_entropy_models.py -q
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  e2e:
    name: e2e sweep (all modes x 4 langs, 0 JS errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 serve.py &
      - name: Sweep every mode in every language
        run: node test_sweep.mjs
      - name: Research explorer interactions (no Pyodide dependency)
        run: node tests/research_browser.mjs
        env:
          TAF_URL: http://127.0.0.1:8000/
      - name: Guide routes in all modes and languages
        run: node tests/guide_bridge_browser.mjs
        env:
          TAF_URL: http://127.0.0.1:8000/
      - name: Real Profile metric explanations
        run: node tests/guide_profile_browser.mjs
        env:
          TAF_URL: http://127.0.0.1:8000/
      - name: Measurement protocols and uniform control
        run: node tests/measurement_browser.mjs
        env:
          TAF_URL: http://127.0.0.1:8000/
      - name: Entropy help, command builder and demos in four languages
        run: node tests/entropy_browser.mjs
        env:
          TAF_URL: http://127.0.0.1:8000/
