name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # The deploy step used to query the artifact a few ms after the upload and found none ("Fetching artifact
      # metadata failed"); a short pause lets the artifact API catch up.
      - name: Wait for the artifact to be visible
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
